name: Bygg og publiser ERPNext-image med enk_norge

# Bygger et komplett ERPNext-bench-image (frappe + erpnext + denne appen) og pusher
# til GHCR under ghcr.io/<eier>/erpnext-enk. Serveren PULLER imaget — ingenting
# bygges der.
#
# Merk: dette er IKKE et auto-deploy. Et nytt image må alltid følges av
# `bench migrate` mot databasen, så utrulling skjer bevisst og ikke via automatisk
# oppdatering av containere. Se docs/deploy.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Kildetaggen og committen er bevisst låst til versjonene som er testet lokalt.
  # Denne verdien brukes også som tagg for Frappe Docker sine offisielle build/base-images.
  FRAPPE_REF: v16.34.0
  FRAPPE_SHA: c1f1e8ec3708750d7254f7f99d869ffb9886f19f
  ERPNEXT_REF: v16.35.0
  ERPNEXT_SHA: 12cd563fb9a79731f75ae2a45b1446a0a2dd9e74
  # Containerfile-en under er kontrollert mot denne revisjonen. En eksplisitt
  # oppgradering skal verifisere secret- og CACHE_BUST-kontrakten på nytt.
  FRAPPE_DOCKER_REF: c74f28db98fde650612d02a5353177a9c2df4f34

jobs:
  pure-tests:
    name: Rene Python-tester
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Hent enk_norge ved committen som trigget jobben
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Sett opp Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Installer appavhengigheter
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Kjør rene regler, SAF-T, årsoppgjør og MVA-tester
        # Frappe installeres ikke i denne jobben. Integrasjonstester blir derfor
        # eksplisitt holdt utenfor, og eventuelle Frappe-klasser i modulene skippes.
        run: |
          python -m unittest -v \
            enk_norge.tests.test_norway_rules \
            enk_norge.tests.test_saft \
            enk_norge.tests.test_posting_contract \
            enk_norge.tests.test_year_end \
            enk_norge.tests.test_vat \
            enk_norge.tests.test_deferrals \
            enk_norge.tests.test_settlement

      - name: Bygg wheel og verifiser SAF-T-XSD
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("enk_norge-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"forventet én enk_norge-wheel, fikk {wheels}")
          expected = "enk_norge/schemas/Norwegian_SAF-T_Financial_Schema_v_1.40.xsd"
          with ZipFile(wheels[0]) as wheel:
              if expected not in wheel.namelist():
                  raise SystemExit(f"mangler {expected} i {wheels[0]}")
          PY

  build:
    needs: pure-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Hent enk_norge ved committen som trigget jobben
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Hent frappe_docker (byggekontekst)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: ${{ env.FRAPPE_DOCKER_REF }}
          path: frappe_docker
          persist-credentials: false

      - name: Sett image-navn fra repoeieren
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/erpnext-enk" >> "$GITHUB_ENV"

      - name: Sett opp Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logg inn på GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verifiser offentlige kildepinner og klargjør app-listen
        # apps.json er den versjonerte kontrakten. Bare URL-en for privatappen
        # erstattes i kopien som sendes som BuildKit-secret; tokenet blir aldri
        # skrevet i Containerfile, build-arg eller image-lag.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_tag() {
            actual="$(git ls-remote --exit-code --tags "$1" "refs/tags/$2" | awk '{print $1}')"
            test "$actual" = "$3"
          }
          verify_tag https://github.com/frappe/frappe.git "$FRAPPE_REF" "$FRAPPE_SHA"
          verify_tag https://github.com/frappe/erpnext.git "$ERPNEXT_REF" "$ERPNEXT_SHA"

          # Nøyaktig én ERPNext-oppføring og nøyaktig én enk_norge-oppføring (hvilken som
          # helst eier, slik at en fork kan bygge uten å endre apps.json). Den siste
          # erstattes med repoet som bygger.
          jq -e --arg erpnext_ref "$ERPNEXT_REF" '
            length == 2 and
            ([.[] | select(.url == "https://github.com/frappe/erpnext" and .branch == $erpnext_ref)] | length == 1) and
            ([.[] | select((.url | test("^https://github\\.com/[^/]+/enk_norge$")) and .branch == "main")] | length == 1)
          ' apps.json > /dev/null

          private_app_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          umask 077
          jq --arg private_app_url "$private_app_url" '
            map(if (.url | test("^https://github\\.com/[^/]+/enk_norge$")) then .url = $private_app_url else . end)
          ' apps.json > "$RUNNER_TEMP/apps.build.json"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("frappe_docker/images/layered/Containerfile")
          source = path.read_text()
          replacements = {
              'ARG CACHE_BUST=""': 'ARG CACHE_BUST=""\n\nARG FRAPPE_SHA\nARG ERPNEXT_SHA\nARG ENK_NORGE_SHA',
              'find apps -mindepth 1 -path "*/.git" | xargs rm -fr': '''test "$(git -C apps/frappe rev-parse HEAD)" = "${FRAPPE_SHA}" && \\
              test "$(git -C apps/erpnext rev-parse HEAD)" = "${ERPNEXT_SHA}" && \\
              git -C apps/enk_norge fetch --depth 1 upstream "${ENK_NORGE_SHA}" && \\
              git -C apps/enk_norge checkout --detach "${ENK_NORGE_SHA}" && \\
              bench setup requirements enk_norge && \\
              bench build --app enk_norge && \\
              test "$(git -C apps/enk_norge rev-parse HEAD)" = "${ENK_NORGE_SHA}" && \\
              printf '%s\\n' "${FRAPPE_SHA}" > frappe.sha && \\
              printf '%s\\n' "${ERPNEXT_SHA}" > erpnext.sha && \\
              printf '%s\\n' "${ENK_NORGE_SHA}" > enk_norge.sha && \\
              find apps -mindepth 1 -path "*/.git" -exec rm -rf {} +''',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"forventet én forekomst av: {old}")
              source = source.replace(old, new)
          path.write_text(source)
          PY

      - name: Bygg og push
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          secret-files: |
            apps_json=${{ runner.temp }}/apps.build.json
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_REF }}
            FRAPPE_PATH=https://github.com/frappe/frappe
            CACHE_BUST=${{ github.sha }}
            FRAPPE_SHA=${{ env.FRAPPE_SHA }}
            ERPNEXT_SHA=${{ env.ERPNEXT_SHA }}
            ENK_NORGE_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:v16-${{ github.sha }}
            ${{ env.IMAGE }}:v16
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verifiser kildepinner og noter versjoner i pushet image
        run: |
          image="${IMAGE}:v16-${GITHUB_SHA}"
          docker pull "$image"
          actual_frappe_sha="$(docker run --rm --entrypoint cat "$image" /home/frappe/frappe-bench/frappe.sha)"
          actual_erpnext_sha="$(docker run --rm --entrypoint cat "$image" /home/frappe/frappe-bench/erpnext.sha)"
          actual_sha="$(docker run --rm --entrypoint cat "$image" /home/frappe/frappe-bench/enk_norge.sha)"
          test "$actual_frappe_sha" = "$FRAPPE_SHA"
          test "$actual_erpnext_sha" = "$ERPNEXT_SHA"
          test "$actual_sha" = "$GITHUB_SHA"

          {
            echo '## Verifisert image `'"${IMAGE}:v16-${GITHUB_SHA}"'`'
            echo
            echo "Frappe commit: \`${actual_frappe_sha}\`"
            echo "ERPNext commit: \`${actual_erpnext_sha}\`"
            echo "enk_norge commit: \`${actual_sha}\`"
            echo '```'
            docker run --rm --entrypoint bash "$image" \
              -c 'cd /home/frappe/frappe-bench && bench version'
            echo '```'
            echo 'Deploy er et bevisst steg, ikke automatisk. Se docs/deploy.md.'
          } >> "$GITHUB_STEP_SUMMARY"
