name: Bygg og publiser ERPNext-image med enk_norge

# Bygger et komplett ERPNext-bench-image (frappe + erpnext + denne appen) og pusher
# til GHCR. Tower PULLER imaget — ingenting bygges på serveren.
#
# Merk: dette er IKKE et auto-deploy. Watchtower er bevisst skrudd av for ERPNext,
# fordi et nytt image alltid må følges av `bench migrate` mot databasen.
# Utrulling skjer med hosts/tower/scripts/erpnext-deploy.sh i janitor-repoet.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/medpus/erpnext-enk
  FRAPPE_BRANCH: version-16
  # Containerfile-en under er kontrollert mot denne revisjonen. En eksplisitt
  # oppgradering skal verifisere secret- og CACHE_BUST-kontrakten på nytt.
  FRAPPE_DOCKER_REF: c74f28db98fde650612d02a5353177a9c2df4f34

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Hent enk_norge ved committen som trigget jobben
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Hent frappe_docker (byggekontekst)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: ${{ env.FRAPPE_DOCKER_REF }}
          path: frappe_docker
          persist-credentials: false

      - name: Sett opp Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logg inn på GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Klargjør app-listen og lås enk_norge til triggering commit
        # apps.json er den versjonerte kontrakten. Bare URL-en for privatappen
        # erstattes i kopien som sendes som BuildKit-secret; tokenet blir aldri
        # skrevet i Containerfile, build-arg eller image-lag.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app_url="https://github.com/${GITHUB_REPOSITORY}"
          jq -e --arg app_url "$app_url" --arg frappe_branch "$FRAPPE_BRANCH" '
            length == 2 and
            ([.[] | select(.url == "https://github.com/frappe/erpnext" and .branch == $frappe_branch)] | length == 1) and
            ([.[] | select(.url == $app_url and .branch == "main")] | length == 1)
          ' apps.json > /dev/null

          private_app_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          jq --arg app_url "$app_url" --arg private_app_url "$private_app_url" '
            map(if .url == $app_url then .url = $private_app_url else . end)
          ' apps.json > apps.build.json

          python3 - <<'PY'
          from pathlib import Path

          path = Path("frappe_docker/images/layered/Containerfile")
          source = path.read_text()
          replacements = {
              'ARG CACHE_BUST=""': 'ARG CACHE_BUST=""\n\nARG ENK_NORGE_SHA',
              'find apps -mindepth 1 -path "*/.git" | xargs rm -fr': '''git -C apps/enk_norge fetch --depth 1 upstream "${ENK_NORGE_SHA}" && \\
              git -C apps/enk_norge checkout --detach "${ENK_NORGE_SHA}" && \\
              bench setup requirements enk_norge && \\
              bench build --app enk_norge && \\
              test "$(git -C apps/enk_norge rev-parse HEAD)" = "${ENK_NORGE_SHA}" && \\
              printf '%s\\n' "${ENK_NORGE_SHA}" > enk_norge.sha && \\
              find apps -mindepth 1 -path "*/.git" -exec rm -rf {} +''',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"forventet én forekomst av: {old}")
              source = source.replace(old, new)
          path.write_text(source)
          PY

      - name: Bygg og push
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          secret-files: |
            apps_json=apps.build.json
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            FRAPPE_PATH=https://github.com/frappe/frappe
            CACHE_BUST=${{ github.sha }}
            ENK_NORGE_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:v16-${{ github.sha }}
            ${{ env.IMAGE }}:v16
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verifiser commit og noter versjoner i pushet image
        run: |
          image="${IMAGE}:v16-${GITHUB_SHA}"
          docker pull "$image"
          actual_sha="$(docker run --rm --entrypoint cat "$image" /home/frappe/frappe-bench/enk_norge.sha)"
          test "$actual_sha" = "$GITHUB_SHA"

          {
            echo '## Verifisert image `'"${IMAGE}:v16-${GITHUB_SHA}"'`'
            echo
            echo "enk_norge commit: \`${actual_sha}\`"
            echo '```'
            docker run --rm --entrypoint bash "$image" \
              -c 'cd /home/frappe/frappe-bench && bench version'
            echo '```'
            echo 'Første deploy fra offisielt image: `bash ~/git/janitor/hosts/tower/scripts/erpnext-deploy.sh v16-'"${GITHUB_SHA}"' ghcr.io/medpus/erpnext-enk`'
          } >> "$GITHUB_STEP_SUMMARY"
