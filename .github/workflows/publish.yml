name: Bygg og publiser ERPNext-image med enk_norge

# Bygger et komplett ERPNext-bench-image (frappe + erpnext + denne appen) og pusher
# til GHCR. Tower PULLER imaget — ingenting bygges på serveren.
#
# Merk: dette er IKKE et auto-deploy. Watchtower er bevisst skrudd av for ERPNext,
# fordi et nytt image alltid må følges av `bench migrate` mot databasen.
# Utrulling skjer med hosts/tower/scripts/erpnext-deploy.sh i janitor-repoet.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/medpus/erpnext-enk
  FRAPPE_BRANCH: version-16

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Hent frappe_docker (byggekontekst)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Sett opp Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logg inn på GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lag apps.json
        # Denne appen er et privat repo, så URL-en får et kortlevd token. Fila sendes
        # som BuildKit-secret (ikke build-arg), slik at tokenet aldri havner i
        # `docker image history`. Derfor skrives den her og ikke i repoet.
        run: |
          cat > apps.json <<EOF
          [
            { "url": "https://github.com/frappe/erpnext", "branch": "${FRAPPE_BRANCH}" },
            { "url": "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}", "branch": "main" }
          ]
          EOF
          jq -e 'length == 2' apps.json > /dev/null

      - name: Bygg og push
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          secret-files: |
            apps_json=apps.json
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            FRAPPE_PATH=https://github.com/frappe/frappe
          tags: |
            ${{ env.IMAGE }}:v16-${{ github.sha }}
            ${{ env.IMAGE }}:v16
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Noter hvilke versjoner som faktisk havnet i imaget
        # apps.json peker på grener, ikke tagger, så det eksakte innholdet avgjøres
        # på byggetidspunktet. Da må imaget kunne fortelle hva det ble.
        run: |
          {
            echo '## Versjoner i `'"${IMAGE}:v16-${{ github.sha }}"'`'
            echo '```'
            docker run --rm --entrypoint bash "${IMAGE}:v16-${{ github.sha }}" \
              -c 'cd /home/frappe/frappe-bench && bench version' || echo "(kunne ikke lese bench version)"
            echo '```'
            echo 'Deploy: `bash ~/git/janitor/hosts/tower/scripts/erpnext-deploy.sh v16-'"${{ github.sha }}"'`'
          } >> "$GITHUB_STEP_SUMMARY"
